<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Davide Ghiotto">
  <!-- lime tile -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#CBDA42" />

  <!-- hair: swept-up wave, four lobes, arched hairline -->
  <path fill="#0E0B14" d="M7.5 30 C6 21 9.5 13.5 16.5 11 C19 5 26 2.5 31.5 5 C36 1.5 44 2.5 47 8.5 C53 9 57.5 14.5 56.5 21 C58 24 57.5 27.5 56.5 30 Q32 22 7.5 30 Z" />
  <!-- highlight swoosh -->
  <path d="M19.5 12 Q29 5.5 40 9" fill="none" stroke="#F2F0EA" stroke-width="2.8" stroke-linecap="round" />

  <!-- glasses -->
  <g stroke="#0E0B14" stroke-width="4">
    <circle cx="21.5" cy="38" r="8.5" fill="#F2F0EA" />
    <circle cx="42.5" cy="38" r="8.5" fill="#F2F0EA" />
    <path d="M30 37 Q32 35.5 34 37" fill="none" stroke-linecap="round" />
  </g>
  <!-- eyes, glancing left like the mascot -->
  <g fill="#0E0B14">
    <circle cx="19.8" cy="38.5" r="2.9" />
    <circle cx="40.8" cy="38.5" r="2.9" />
  </g>

  <!-- moustache: thin flat bar -->
  <path d="M26 52 H38" fill="none" stroke="#0E0B14" stroke-width="3.6" stroke-linecap="round" />
</svg>
