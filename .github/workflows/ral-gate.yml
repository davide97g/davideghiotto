name: ral-gate

# Dokploy's own auto-deploy is off — a GitHub webhook cannot reach the homelab,
# which forwards no inbound port. This workflow is the only path from main to
# production for the service, and it runs the tests before it takes it.
on:
  push:
    branches: [main]
    paths:
      - 'services/ral-gate/**'
      - '.github/workflows/ral-gate.yml'
  pull_request:
    paths:
      - 'services/ral-gate/**'
      - '.github/workflows/ral-gate.yml'

# Queue pushes rather than cancelling them: a cancelled run leaves main green and
# undeployed, and two quick pushes would otherwise deploy out of order.
concurrency:
  group: ral-gate-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: services/ral-gate

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/ral-gate/package-lock.json

      - run: npm ci

      - run: npm test

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    env:
      # deploy-ral.davideghiotto.it — a tunnel hostname whose path rule allows
      # application.deploy and application.one and nothing else, so this key
      # cannot reach the rest of Dokploy's admin API even if it leaks.
      DOKPLOY_URL: ${{ secrets.RAL_DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.RAL_DOKPLOY_API_KEY }}
      DOKPLOY_APPLICATION_ID: ${{ secrets.RAL_DOKPLOY_APPLICATION_ID }}

    steps:
      # Status alone cannot say whether this deploy has started: it still reads
      # "done" from the previous one for the first few seconds. The id of the
      # newest deployment can — newest by createdAt, because Dokploy returns the
      # list oldest first.
      - name: Note the current deployment
        run: |
          echo "before=$(curl -fsS --max-time 30 \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            "$DOKPLOY_URL/api/application.one?applicationId=$DOKPLOY_APPLICATION_ID" |
            python3 -c 'import json,sys; d=sorted(json.load(sys.stdin)["deployments"], key=lambda x: x["createdAt"]); print(d[-1]["deploymentId"] if d else "")')" >> "$GITHUB_ENV"

      - name: Trigger the Dokploy deploy
        run: |
          curl -fsS --max-time 60 -X POST \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'content-type: application/json' \
            -d "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\"}" \
            "$DOKPLOY_URL/api/application.deploy"

      # The trigger only queues the build. Without this wait a red deploy still
      # shows a green workflow, which is the one thing this job exists to stop.
      - name: Wait for the deploy to finish
        run: |
          for _ in $(seq 1 120); do
            sleep 15
            latest="$(curl -fsS --max-time 30 \
              -H "x-api-key: $DOKPLOY_API_KEY" \
              "$DOKPLOY_URL/api/application.one?applicationId=$DOKPLOY_APPLICATION_ID" |
              python3 -c 'import json,sys; d=sorted(json.load(sys.stdin)["deployments"], key=lambda x: x["createdAt"]); print(d[-1]["deploymentId"], d[-1]["status"]) if d else print("none idle")')"
            id="${latest%% *}"
            status="${latest##* }"
            if [ "$id" = "$before" ]; then
              echo "waiting for Dokploy to pick up the deploy"
              continue
            fi
            echo "deployment $id: $status"
            case "$status" in
              done) exit 0 ;;
              error) echo "::error::Dokploy reported a failed deploy"; exit 1 ;;
            esac
          done
          echo "::error::deploy still running after 30 minutes"
          exit 1
